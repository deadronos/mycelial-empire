name: Deploy to GitHub Pages

# Build the site and publish to GitHub Pages using the modern, non-deprecated actions
# Trigger: only run on tag pushes that start with `v` (e.g. `v1.0.0`).
on:
  push:
    tags: ['v*']

permissions:
  # This workflow publishes a static site by pushing the built `dist/` to the
  # `gh-pages` branch. `contents: write` is the minimum required permission.
  contents: write

concurrency:
  group: "deploy-pages-mycelial-empire"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          # explicit base for GitHub Pages; can be overridden by VITE_BASE if needed
          VITE_BASE: "/mycelial-empire/"
        run: npm run build --if-present

      - name: Deploy to GitHub Pages (push to gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./dist
          publish_branch: gh-pages
          # keep history so users can inspect past deployments if needed
          keep_files: false
          # uses the automatically provided GITHUB_TOKEN

